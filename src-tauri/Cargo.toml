[package]
name = "znotes"
description = "Offline markdown notes with encryption at rest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "znotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
znotes-core = { path = "../crates/znotes-core" }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
tempfile = "3"
