[workspace]
resolver = "2"
members = ["src-tauri", "crates/znotes-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/techiesolo/znotes"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[profile.release]
panic = "abort"
strip = true
